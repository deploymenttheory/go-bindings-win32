name: Linter

on:
  pull_request:
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  packages: read
  statuses: write # To report GitHub Actions status checks
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          
      - name: Lint Code Base with Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: origin/main
          VALIDATE_ALL_CODEBASE: false # tells the linter to only check files that have been modified in the current pull request
          VALIDATE_GO: true
          VALIDATE_GOFMT: true
          VALIDATE_GOCYCLO: true
          VALIDATE_GOVET: true
          VALIDATE_GOLANGCI_LINT: true
          VALIDATE_CPD: false # Disable CPD (Copy Paste Detection) for all languages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # To report GitHub Actions status checks
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          # bindings/win32/ is generated and not hand-editable, so a per-file
          # lint there has nothing actionable to report — the fix for anything
          # it found would be in the generator. It is already covered by the
          # package-mode golangci-lint job, the regeneration determinism gate,
          # and the Windows build and tests in ci.yml.
          #
          # Excluding it also avoids a golangci-lint limitation super-linter
          # runs into: given an explicit file list spanning two directories it
          # fails with "named files must all be in one directory", which any PR
          # touching both the hand-written runtime and the regenerated tree
          # triggers.
          FILTER_REGEX_EXCLUDE: |
            .*\.md$|                # Exclude all markdown files
            .*test/.*|              # Exclude all files in any test directory
            .*_test\.go$|           # Exclude Go test files (e.g., *_test.go)
            .*bindings/win32/.*|    # Exclude the generated bindings tree
            .*\.json$               # Exclude all JSON files
