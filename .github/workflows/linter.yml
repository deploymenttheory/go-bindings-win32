name: Linter

on:
  pull_request:
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  packages: read
  statuses: write # To report GitHub Actions status checks
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          
      - name: Lint Code Base with Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: origin/main
          VALIDATE_ALL_CODEBASE: false # tells the linter to only check files that have been modified in the current pull request
          # This list is opt-in: naming linters here runs those and only those.
          # VALIDATE_GO and VALIDATE_GOLANGCI_LINT are deliberately ABSENT
          # rather than set to false — setting any validator false flips
          # super-linter to opt-out and enables every other linter it ships.
          #
          # They are omitted because both run golangci-lint over the PR's
          # changed FILES, and given a list spanning two directories it refuses
          # outright:
          #
          #   named files must all be in one directory;
          #   have bindings/runtime/win32 and internal/codegen/emit/raw
          #
          # which is true of any PR touching more than one package. That is a
          # limitation of file-list mode, not something a file can be edited to
          # satisfy. go-lint.yml already runs golangci-lint in package mode, so
          # this was a broken duplicate of a check that works.
          #
          # The per-FILE tools below have no such constraint and stay on.
          VALIDATE_GOFMT: true
          VALIDATE_GOCYCLO: true
          VALIDATE_GOVET: true
          VALIDATE_CPD: false # Disable CPD (Copy Paste Detection) for all languages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # To report GitHub Actions status checks
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          # bindings/win32/ is generated and not hand-editable, so a per-file
          # lint there has nothing actionable to report — the fix for anything
          # it found would be in the generator. It is already covered by the
          # package-mode golangci-lint job, the regeneration determinism gate,
          # and the Windows build and tests in ci.yml.
          #
          # Excluding it also avoids a golangci-lint limitation super-linter
          # runs into: given an explicit file list spanning two directories it
          # fails with "named files must all be in one directory", which any PR
          # touching both the hand-written runtime and the regenerated tree
          # triggers.
          # One line, no inline comments: this value is a single regex, and the
          # previous block-scalar form folded the comment text and newlines into
          # the alternation — so branches after the first never matched anything
          # and the exclusions silently did nothing.
          #
          # Branches: markdown | any test directory | Go test files |
          # the generated bindings tree | JSON.
          FILTER_REGEX_EXCLUDE: '.*\.md$|.*test/.*|.*_test\.go$|.*bindings/win32/.*|.*\.json$'
