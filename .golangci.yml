version: "2"

# This is a stdlib-only syscall-binding generator: no HTTP, no contexts, no
# struct tags to police. The linter set is trimmed to what can actually fire
# here, and the run is enforcing (see .github/workflows/go-lint.yml, which
# runs it under GOOS=windows so the runtime and generated tree typecheck).

run:
  timeout: 30m
  modules-download-mode: readonly
  allow-parallel-runners: true
  concurrency: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    # Core correctness
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - errorlint

    # Security & quality
    - gosec
    - gocritic
    - prealloc
    - misspell
    - nakedret

  settings:
    govet:
      # unsafeptr: uintptr(unsafe.Pointer(p)) in syscall argument lists is the
      # sanctioned keepalive pattern, not a misuse. stdmethods: COM vtable
      # methods (IStream.Seek, …) legitimately mismatch io.Seeker's shape.
      disable:
        - unsafeptr
        - stdmethods
    nakedret:
      max-func-lines: 40
    gosec:
      excludes:
        # G306: generated source files and the diagnostics baseline are
        # written 0644 on purpose — they are committed, not secrets.
        - G306
        # G122: pruneStale walks the generator's own output tree; there is no
        # untrusted path to race against.
        - G122
        # G115: the int64 → uintN conversions are the documented two's-
        # complement wraps for negative enum/constant literals.
        - G115

  exclusions:
    # Skip files carrying Go's canonical "Code generated … DO NOT EDIT." header
    # (the whole bindings/win32 tree and the generated acceptance tests).
    generated: strict
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - linters:
          - staticcheck
        text: "SA9003:"
    paths:
      - "examples/.*"
    paths-except:
      - "internal/.*\\.go$"

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    warn-unused: true
    generated: strict

output:
  formats:
    text:
      path: stderr
      print-linter-name: true
      print-issued-lines: true
      colors: true
    sarif:
      path: golangci-lint-report.sarif
  path-mode: ""
  sort-order:
    - severity
    - file
  show-stats: true
